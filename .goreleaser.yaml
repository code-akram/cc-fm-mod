# Builds the cc-fm player for macOS and Linux and publishes a GitHub release.
# The Homebrew formula is written by scripts/formula.sh rather than GoReleaser,
# whose formula support is deprecated and whose casks can't run `brew services`.
version: 2
project_name: cc-fm

builds:
  - id: cc-fm
    main: ./cmd/cc-fm
    binary: cc-fm
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

archives:
  - formats: [tar.gz]
    # No version in the name, so .../releases/latest/download/<name> always works.
    name_template: "cc-fm_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^Merge "]

release:
  github:
    owner: code-akram
    name: cc-fm-mod
